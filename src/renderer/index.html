<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Vegestock</title>
  <style>
    :root {
      --bg: #f4f7f4; --surface: #fff; --text: #1f2d24; --muted: #6b7c72;
      --primary: #2e7d4f; --primary-soft: #e6f3ea; --danger: #c0392b; --danger-soft: #fbe9e7;
      --border: #e1e8e3; --shadow: 0 1px 3px rgba(20,40,28,.08), 0 4px 14px rgba(20,40,28,.06); --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101713; --surface: #18221c; --text: #e6efe9; --muted: #8fa397;
        --primary: #4fbf7a; --primary-soft: #1f3a2a; --danger: #ff7b6b; --danger-soft: #3a211e;
        --border: #26342b; --shadow: 0 1px 3px rgba(0,0,0,.4);
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    [hidden] { display: none !important; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px 0; position: sticky; top: 0; z-index: 5; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .logo { width: 64px; height: 64px; border-radius: 10px; object-fit: contain; }
    .brand h1 { font-size: 18px; margin: 0; }
    .brand span { color: var(--muted); font-size: 13px; }
    [role=tablist] { display: flex; gap: 4px; overflow-x: auto; }
    [role=tab] { background: none; border: none; padding: 10px 14px; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
    [role=tab][aria-selected=true] { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
    [role=tabpanel] { padding: 24px; max-width: 1280px; margin: 0 auto; }
    table { border-collapse: collapse; width: 100%; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
    th, td { border-bottom: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    input, select { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
    input[type=checkbox], input[type=radio] { padding: 0; }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    fieldset { border: 1px solid var(--border); border-radius: 10px; }
    button { font: inherit; color: inherit; }
    form button[type=submit], .btn-primary {
      background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--shadow); }
    .btn-ghost { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
    .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
    .alerte { color: var(--danger); background: var(--danger-soft); border-radius: 10px; padding: 10px 14px; }
    .stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat { background: var(--surface); border-radius: var(--radius); padding: 14px 18px; box-shadow: var(--shadow); min-width: 160px; }
    .stat strong { display: block; font-size: 22px; }
    .stat small { color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .search { position: relative; flex: 1 1 320px; max-width: 460px; }
    .search input { width: 100%; padding-left: 40px; border-radius: 999px; background: var(--surface); }
    .search input:focus { box-shadow: 0 0 0 4px var(--primary-soft); }
    .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .filters { display: flex; gap: 8px; }
    .chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; font-size: 14px; }
    .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--border); transition: transform .15s; }
    .card:hover { transform: translateY(-2px); }
    .card.inactive { opacity: .72; }
    .card-head { display: flex; gap: 12px; align-items: center; }
    .avatar { width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 700; }
    .card-title { flex: 1; min-width: 0; }
    .card-title h3 { margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-title small, .muted { color: var(--muted); }
    .badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); }
    .badge.off { background: var(--danger-soft); color: var(--danger); }
    .info { display: grid; gap: 8px; font-size: 14px; }
    .info div { display: flex; gap: 10px; align-items: flex-start; word-break: break-word; }
    .info svg { flex-shrink: 0; color: var(--muted); margin-top: 2px; }
    .info a { color: inherit; }
    .card-foot { display: flex; justify-content: flex-end; border-top: 1px solid var(--border); padding-top: 12px; }
    td input { width: 100%; }
    input.invalide { border-color: var(--danger); background: var(--danger-soft); }
    .toolbar .actions { display: flex; gap: 8px; }
    .empty { text-align: center; color: var(--muted); padding: 60px 0; }
    .overlay { position: fixed; inset: 0; background: rgba(10,20,14,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
    #fiche { background: var(--surface); border-radius: 18px; width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    #fiche h2 { margin: 0; font-size: 20px; }
    #fiche .full { grid-column: 1 / -1; }
    #fiche label { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
    #fiche label.check { display: flex; align-items: center; gap: 8px; }
    #fiche .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    @media (max-width: 600px) { [role=tabpanel] { padding: 16px; } #fiche { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="logo.png" alt="Vegestock">
      <div><h1>Vegestock</h1><span>Administration du site Végéstock.com</span></div>
    </div>
    <div role="tablist">
      <button role="tab" aria-controls="producteurs" aria-selected="true">Producteurs</button>
      <button role="tab" aria-controls="conditionnements" aria-selected="false">Conditionnements</button>
      <button role="tab" aria-controls="tailles" aria-selected="false">Tailles</button>
      <button role="tab" aria-controls="parametres" aria-selected="false">Paramètres</button>
    </div>
  </header>

  <section role="tabpanel" id="producteurs">
    <p id="producteurs-erreur" class="alerte" role="alert" hidden></p>
    <div class="stats">
      <div class="stat"><strong id="stat-total">0</strong><small>Producteurs</small></div>
      <div class="stat"><strong id="stat-actifs">0</strong><small>Actifs</small></div>
      <div class="stat"><strong id="stat-inactifs">0</strong><small>Inactifs</small></div>
    </div>
    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="recherche" type="search" placeholder="Rechercher un producteur, une ville, un email…" autocomplete="off">
      </div>
      <div class="filters">
        <button type="button" class="chip active" data-filtre="tous">Tous</button>
        <button type="button" class="chip" data-filtre="actifs">Actifs</button>
        <button type="button" class="chip" data-filtre="inactifs">Inactifs</button>
      </div>
      <select id="tri" aria-label="Trier par">
        <option value="entreprise">Tri : entreprise</option>
        <option value="id">Tri : id</option>
      </select>
      <button type="button" class="btn-primary" id="ajouter">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Ajouter
      </button>
    </div>
    <div class="grid" id="producteurs-liste"></div>
    <div class="empty" id="vide" hidden>Aucun producteur trouvé.</div>

    <div class="overlay" id="overlay" hidden>
      <form id="fiche">
        <h2 class="full">Fiche producteur</h2>
        <label>Id<input name="id" readonly></label>
        <label>Entreprise<input name="entreprise" required></label>
        <label class="full">Email<input name="email" type="email"></label>
        <label class="full">Logo (URL)<input name="logo"></label>
        <label class="full">Adresse<input name="adresse"></label>
        <label>Code postal<input name="codepostal"></label>
        <label>Ville<input name="ville"></label>
        <label>Téléphone<input name="telephone"></label>
        <label>Fax<input name="fax"></label>
        <label class="full check"><input name="actif" type="checkbox"> Actif</label>
        <p id="fiche-erreur" class="alerte full" role="alert" hidden style="margin:0"></p>
        <div class="actions full"><button type="button" class="btn-ghost" id="fiche-annuler">Annuler</button><button type="submit">Enregistrer</button></div>
      </form>
    </div>
  </section>
  <section role="tabpanel" id="conditionnements" hidden></section>
  <section role="tabpanel" id="tailles" hidden></section>

  <section role="tabpanel" id="parametres" hidden>
    <form id="parametres-form" style="display:grid;gap:8px;max-width:520px">
      <label>URL de l'API des producteurs<br><input id="p-url" type="url" required style="width:100%"></label>
      <label>Jeton (Bearer)<br><input id="p-jeton" type="password" autocomplete="off" style="width:100%"></label>
      <p id="p-jeton-etat" class="muted" style="margin:0"></p>
      <fieldset style="display:grid;gap:8px">
        <legend>Fichier producteur.csv</legend>
        <label><input type="radio" name="csv-mode" value="chemin"> Chemin du fichier</label>
        <div id="csv-chemin-bloc" style="display:flex;gap:8px">
          <input id="c-chemin" placeholder="C:\vegestock\producteur.csv" style="flex:1">
          <button type="button" class="btn-ghost" id="c-parcourir">Parcourir…</button>
        </div>
        <label><input type="radio" name="csv-mode" value="ftp"> FTP</label>
        <div id="csv-ftp-bloc" style="display:grid;gap:8px">
          <label>Hôte<br><input id="c-hote" style="width:100%"></label>
          <label>Port<br><input id="c-port" type="number" min="1" max="65535" value="21" style="width:100%"></label>
          <label>Utilisateur<br><input id="c-utilisateur" autocomplete="off" style="width:100%"></label>
          <label>Mot de passe<br><input id="c-mdp" type="password" autocomplete="off" style="width:100%"></label>
          <p id="c-mdp-etat" class="muted" style="margin:0"></p>
          <label>Chemin distant<br><input id="c-distant" placeholder="/data/producteur.csv" style="width:100%"></label>
        </div>
      </fieldset>
      <button type="submit" style="justify-self:start">Enregistrer</button>
      <p id="p-msg" role="status" style="margin:0"></p>
    </form>
  </section>

  <script>
    const chargeurs = {}; // id d'onglet -> chargement des données à l'ouverture
    const tabs = document.querySelectorAll("[role=tab]");
    tabs.forEach((t) => t.addEventListener("click", () => {
      chargeurs[t.getAttribute("aria-controls")]?.();
      tabs.forEach((o) => {
        const on = o === t;
        o.setAttribute("aria-selected", on);
        document.getElementById(o.getAttribute("aria-controls")).hidden = !on;
      });
    }));

    const CHAMPS = ["id", "entreprise", "email", "logo", "adresse", "codepostal", "ville", "telephone", "fax", "actif"];
    const liste = document.getElementById("producteurs-liste");
    const fiche = document.getElementById("fiche");
    const overlay = document.getElementById("overlay");
    const ficheErreur = document.getElementById("fiche-erreur");
    const recherche = document.getElementById("recherche");
    const triSel = document.getElementById("tri");
    let producteurs = [];
    let filtre = "tous";
    let mode = "modif"; // "ajout" | "modif"

    const norm = (s) => String(s ?? "").normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();
    const estActif = (p) => !!Number(p.actif);
    const initiales = (nom) => String(nom).replace(/[^A-Za-zÀ-ÿ\s]/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";
    const ICONES = {
      mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
      pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
      tel: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
    };

    function el(tag, cls, texte) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (texte != null) e.textContent = texte;
      return e;
    }
    function ligne(icone, ...contenu) {
      const d = el("div");
      d.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONES[icone]}</svg>`;
      const s = el("span");
      s.append(...contenu);
      d.append(s);
      return d;
    }
    const nonRenseigne = () => el("span", "muted", "Non renseigné");

    function carte(p) {
      const c = el("article", "card" + (estActif(p) ? "" : " inactive"));
      const titre = el("div", "card-title");
      const h = el("h3", null, p.entreprise);
      h.title = p.entreprise;
      titre.append(h, el("small", null, "Réf. " + p.id));
      const tete = el("div", "card-head");
      tete.append(el("div", "avatar", initiales(p.entreprise)), titre, el("span", "badge" + (estActif(p) ? "" : " off"), estActif(p) ? "Actif" : "Inactif"));

      let mail = nonRenseigne();
      if (p.email) { mail = el("a", null, p.email); mail.href = "mailto:" + p.email; }
      const tel = [p.telephone ? el("span", null, p.telephone) : nonRenseigne()];
      if (p.fax) tel.push(el("span", "muted", " · Fax " + p.fax));
      const info = el("div", "info");
      info.append(
        ligne("mail", mail),
        ligne("pin", p.adresse ?? "", document.createElement("br"), el("span", "muted", `${p.codepostal ?? ""} ${p.ville ?? ""}`)),
        ligne("tel", ...tel),
      );

      const btn = el("button", "btn-ghost", "Modifier");
      btn.addEventListener("click", () => ouvrirFiche(p));
      const pied = el("div", "card-foot");
      pied.append(btn);
      c.append(tete, info, pied);
      return c;
    }

    function afficherProducteurs() {
      const q = norm(recherche.value.trim());
      const rows = producteurs.filter((p) =>
        (filtre === "tous" || (filtre === "actifs") === estActif(p)) &&
        norm([p.entreprise, p.ville, p.email, p.codepostal].join(" ")).includes(q));
      rows.sort(triSel.value === "id"
        ? (a, b) => Number(a.id) - Number(b.id)
        : (a, b) => String(a.entreprise).localeCompare(String(b.entreprise), "fr"));
      const actifs = producteurs.filter(estActif).length;
      document.getElementById("stat-total").textContent = producteurs.length;
      document.getElementById("stat-actifs").textContent = actifs;
      document.getElementById("stat-inactifs").textContent = producteurs.length - actifs;
      document.getElementById("vide").hidden = rows.length > 0;
      liste.replaceChildren(...rows.map(carte));
    }

    recherche.addEventListener("input", afficherProducteurs);
    triSel.addEventListener("change", afficherProducteurs);
    document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => {
      document.querySelectorAll(".chip").forEach((o) => o.classList.toggle("active", o === b));
      filtre = b.dataset.filtre;
      afficherProducteurs();
    }));

    function ouvrirFiche(p, m = "modif") {
      mode = m;
      for (const c of CHAMPS) {
        const e = fiche.elements[c];
        if (c === "actif") e.checked = estActif(p);
        else e.value = p[c] ?? "";
      }
      fiche.elements.email.required = mode === "ajout";
      ficheErreur.hidden = true;
      overlay.hidden = false;
      fiche.elements.entreprise.focus();
    }
    const fermerFiche = () => { overlay.hidden = true; };
    overlay.addEventListener("click", (e) => { if (e.target === overlay) fermerFiche(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") fermerFiche(); });
    document.getElementById("ajouter").addEventListener("click", async () => {
      const erreur = document.getElementById("producteurs-erreur");
      erreur.hidden = true;
      try {
        const id = await window.api.nextIdProducteur();
        ouvrirFiche({ id, actif: 1 }, "ajout");
      } catch (e) {
        erreur.textContent = "Impossible d'obtenir un id disponible : " + e.message;
        erreur.hidden = false;
      }
    });
    document.getElementById("fiche-annuler").addEventListener("click", fermerFiche);
    fiche.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const p = {};
      for (const c of CHAMPS) {
        const e = fiche.elements[c];
        p[c] = c === "actif" ? (e.checked ? 1 : 0) : c === "id" ? Number(e.value) : e.value.trim();
      }
      if (mode === "ajout" && (!p.entreprise || !p.email)) {
        ficheErreur.textContent = "Erreur : l'entreprise et l'email sont obligatoires";
        ficheErreur.hidden = false;
        return;
      }
      try {
        const r = await (mode === "ajout" ? window.api.addProducteur(p) : window.api.updateProducteur(p));
        fermerFiche();
        await chargerProducteurs();
        if (r.avertissement) {
          const w = document.getElementById("producteurs-erreur");
          w.textContent = r.avertissement;
          w.hidden = false;
        }
      } catch (e) {
        ficheErreur.textContent = "Erreur : " + e.message;
        ficheErreur.hidden = false;
      }
    });

    async function chargerProducteurs() {
      const erreur = document.getElementById("producteurs-erreur");
      erreur.hidden = true;
      try {
        producteurs = await window.api.listProducteurs();
        afficherProducteurs();
      } catch (e) {
        erreur.textContent = "Impossible de charger les producteurs : " + e.message;
        erreur.hidden = false;
      }
    }

    // Onglets conditionnements / tailles : tableau code – libellé éditable (le tableau JS `lignes` fait foi, le filtre ne fait que masquer)
    function initCorrespondances(section, nom) {
      let lignes = [];
      let modifie = false;
      const refs = new Map(); // ligne -> { tr, champs }

      const recherche = el("input");
      recherche.type = "search";
      recherche.placeholder = "Rechercher un code ou un libellé…";
      recherche.autocomplete = "off";
      const zoneRecherche = el("div", "search");
      zoneRecherche.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
      zoneRecherche.append(recherche);
      const ajouter = el("button", "btn-ghost", "Ajouter une ligne");
      const enregistrer = el("button", "btn-primary", "Enregistrer");
      ajouter.type = enregistrer.type = "button";
      const actions = el("div", "actions");
      actions.append(ajouter, enregistrer);
      const barre = el("div", "toolbar");
      barre.append(zoneRecherche, actions);

      const message = el("p");
      message.setAttribute("role", "status");
      message.hidden = true;
      const dire = (texte, erreur) => {
        message.textContent = texte;
        message.className = erreur ? "alerte" : "muted";
        message.hidden = !texte;
      };

      const corps = el("tbody");
      const vide = el("tr");
      const celluleVide = el("td", "empty", "Aucune correspondance trouvée");
      celluleVide.colSpan = 2;
      vide.append(celluleVide);
      const entete = el("tr");
      entete.append(el("th", null, "Code"), el("th", null, "Libellé"));
      const table = el("table");
      table.append(el("thead"), corps);
      table.tHead.append(entete);
      section.replaceChildren(barre, message, table);

      function filtrer() {
        const q = norm(recherche.value.trim());
        let visibles = 0;
        for (const l of lignes) {
          const ok = norm(l.code + " " + l.libelle).includes(q);
          refs.get(l).tr.hidden = !ok;
          if (ok) visibles++;
        }
        vide.hidden = visibles > 0;
      }

      // Surligne les champs vides et les codes en doublon
      function controler() {
        const nb = new Map();
        for (const l of lignes) nb.set(l.code.trim(), (nb.get(l.code.trim()) ?? 0) + 1);
        for (const l of lignes) {
          const c = l.code.trim();
          const { champs } = refs.get(l);
          champs.code.classList.toggle("invalide", !c || nb.get(c) > 1);
          champs.libelle.classList.toggle("invalide", !l.libelle.trim());
        }
      }

      function erreur() {
        const vus = new Set();
        for (const [i, l] of lignes.entries()) {
          const c = l.code.trim();
          if (!c) return `Ligne ${i + 1} : le code est obligatoire`;
          if (!l.libelle.trim()) return `Code « ${c} » : le libellé est obligatoire`;
          if (vus.has(c)) return `Code « ${c} » en doublon`;
          vus.add(c);
        }
        return "";
      }

      function afficher() {
        refs.clear();
        const trs = lignes.map((l) => {
          const tr = el("tr");
          const champs = {};
          for (const [cle, nomChamp] of [["code", "Code"], ["libelle", "Libellé"]]) {
            const i = el("input");
            i.value = l[cle];
            i.setAttribute("aria-label", nomChamp);
            i.addEventListener("input", () => { l[cle] = i.value; modifie = true; controler(); });
            champs[cle] = i;
            const td = el("td");
            td.append(i);
            tr.append(td);
          }
          refs.set(l, { tr, champs });
          return tr;
        });
        corps.replaceChildren(...trs, vide);
        filtrer();
        controler();
      }

      recherche.addEventListener("input", filtrer);
      ajouter.addEventListener("click", () => {
        const l = { code: "", libelle: "" };
        lignes.unshift(l);
        modifie = true;
        recherche.value = "";
        afficher();
        refs.get(l).champs.code.focus();
      });
      enregistrer.addEventListener("click", async () => {
        const e = erreur();
        if (e) return dire(e, true);
        enregistrer.disabled = true;
        try {
          await window.api.saveCorrespondances(nom, lignes.map(({ code, libelle }) => ({ code, libelle })));
          for (const l of lignes) { l.code = l.code.trim(); l.libelle = l.libelle.trim(); }
          modifie = false;
          afficher();
          dire("Enregistré.");
        } catch (err) {
          dire("Erreur : " + err.message, true);
        } finally {
          enregistrer.disabled = false;
        }
      });

      // À l'ouverture de l'onglet ; on ne recharge pas tant que des modifications ne sont pas enregistrées
      chargeurs[section.id] = async () => {
        if (modifie) return;
        try {
          lignes = await window.api.listCorrespondances(nom);
          afficher();
          dire("");
        } catch (e) {
          dire("Impossible de charger les correspondances : " + e.message, true);
        }
      };
    }
    initCorrespondances(document.getElementById("conditionnements"), "conditionnements");
    initCorrespondances(document.getElementById("tailles"), "tailles");

    const pUrl = document.getElementById("p-url");
    const pJeton = document.getElementById("p-jeton");
    const pMsg = document.getElementById("p-msg");
    const cChemin = document.getElementById("c-chemin");
    const cHote = document.getElementById("c-hote");
    const cPort = document.getElementById("c-port");
    const cUtilisateur = document.getElementById("c-utilisateur");
    const cMdp = document.getElementById("c-mdp");
    const cDistant = document.getElementById("c-distant");
    const modeCsv = () => document.querySelector("input[name=csv-mode]:checked")?.value ?? "";
    function majBlocsCsv() {
      document.getElementById("csv-chemin-bloc").hidden = modeCsv() !== "chemin";
      document.getElementById("csv-ftp-bloc").hidden = modeCsv() !== "ftp";
    }
    document.querySelectorAll("input[name=csv-mode]").forEach((r) => r.addEventListener("change", majBlocsCsv));
    document.getElementById("c-parcourir").addEventListener("click", async () => {
      const chemin = await window.api.parcourirCsv();
      if (chemin) cChemin.value = chemin;
    });

    async function chargerParametres() {
      const p = await window.api.getParametres();
      pUrl.value = p.url;
      document.getElementById("p-jeton-etat").textContent = p.jetonDefini
        ? "Un jeton est enregistré (laisser vide pour le conserver)."
        : "Aucun jeton enregistré.";
      const csv = p.csv;
      document.querySelectorAll("input[name=csv-mode]").forEach((r) => { r.checked = r.value === csv.mode; });
      cChemin.value = csv.chemin;
      cHote.value = csv.ftp.hote;
      cPort.value = csv.ftp.port;
      cUtilisateur.value = csv.ftp.utilisateur;
      cDistant.value = csv.ftp.cheminDistant;
      document.getElementById("c-mdp-etat").textContent = csv.ftp.mdpDefini
        ? "Un mot de passe est enregistré (laisser vide pour le conserver)."
        : "Aucun mot de passe enregistré.";
      majBlocsCsv();
    }
    document.getElementById("parametres-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try {
        await window.api.saveParametres(pUrl.value.trim(), pJeton.value.trim(), {
          mode: modeCsv(),
          chemin: cChemin.value.trim(),
          ftp: {
            hote: cHote.value.trim(),
            port: Number(cPort.value),
            utilisateur: cUtilisateur.value.trim(),
            mdp: cMdp.value,
            cheminDistant: cDistant.value.trim(),
          },
        });
        pJeton.value = "";
        cMdp.value = "";
        pMsg.textContent = "Enregistré.";
        await chargerParametres();
        await chargerProducteurs();
      } catch (e) {
        pMsg.textContent = "Erreur : " + e.message;
      }
    });

    chargerParametres();
    chargerProducteurs();
  </script>
</body>
</html>
